name: Haskell CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "**.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cabal: ["3.14.2"]
        ghc: ["9.12.2"]
    env:
      CONFIG: "--enable-tests --enable-benchmarks"

    steps:
      - uses: actions/checkout@v4

      # 1. Install & Cache Egglog
      - name: Cache Cargo Binaries
        id: cache-egglog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-egglog-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-egglog-

      - name: Install Rust toolchain
        if: steps.cache-egglog.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Egglog
        if: steps.cache-egglog.outputs.cache-hit != 'true'
        run: cargo install egglog

      # 2. Expose Egglog globally to this job's environment
      - name: Add Cargo Bin to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Egglog
        run: egglog --version

      # 3. Setup and Build Haskell Environment
      - uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - run: cabal v2-update
      - run: cabal v2-freeze $CONFIG

      - name: Cache Haskell Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-

      - run: cabal v2-build $CONFIG

      # - run: cabal v2-test $CONFIG
      
      - run: cabal v2-haddock $CONFIG --haddock-output-dir=./docs/haddock --haddock-quickjump

      - run: cabal v2-sdist

      # 4. Deploy Docs
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/haddock