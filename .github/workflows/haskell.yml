name: Haskell CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  setup-egglog:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Cargo Binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-egglog-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-egglog-
      - name: Install Egglog
        run: |
          git clone https://github.com/egraphs-good/egglog.git
          cargo install --path=egglog

      # Upload the egglog binary file so the Haskell job can use it
      - name: Upload Egglog Binary
        uses: actions/upload-artifact@v4
        with:
          name: egglog-binary
          path: ~/.cargo/bin/egglog
  build-haskell:
    runs-on: ubuntu-latest
    needs: setup-egglog

    strategy:
      matrix:
        cabal: ["3.14.2"]
        ghc: ["9.12.2"]
    env:
      CONFIG: "--enable-tests --enable-benchmarks"

    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - run: cabal v2-update
      - run: cabal v2-freeze $CONFIG
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal v2-build $CONFIG
      - run: cabal v2-test $CONFIG
      - run: cabal v2-haddock $CONFIG --haddock-output-dir=./docs/haddock --haddock-quickjump

      - run: cabal v2-sdist

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/haddock

